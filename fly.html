<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 모바일: 확대/스크롤 방지, 풀스크린 캔버스 -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>FLY</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; }
      canvas { display: block; touch-action: none; }
      /* 시작 안내 오버레이. pointer-events:none → 탭이 캔버스로 통과(시작은 화면 탭으로 처리) */
      #start {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 18px 28px; font: 600 18px/1.2 -apple-system, system-ui, sans-serif;
        color: #FDFDED; background: rgba(20, 24, 40, 0.55);
        border: 1.5px solid rgba(253, 253, 237, 0.7); border-radius: 14px;
        letter-spacing: 0.04em; backdrop-filter: blur(6px);
        pointer-events: none; z-index: 10; text-align: center;
      }
    </style>

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <div id="start">Tab to FLY</div>
    <script src="common.js"></script>
    <script src="phone.js"></script>
  </body>
</html>
